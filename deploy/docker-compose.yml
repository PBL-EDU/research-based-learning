# 基础设施层：PostgreSQL 16 / Redis 7 / MinIO
# 应用层（Caddy / portal / api / worker）在 docker-compose.app.yml，用 -f 叠加。
#
# 起法：
#   仅基础设施（开发、备案期间内测）：docker compose -f docker-compose.yml up -d
#   全栈：                              docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# 原则：除 caddy 外，任何服务都不 publish 端口。公网只认 80/443。

name: rlc

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # 用 Debian 版而不是 alpine：alpine 的 musl 对 C.UTF-8 支持不全，
    # initdb --locale=C.UTF-8 可能直接失败；而且恢复脚本要 CREATE DATABASE ... LC_COLLATE 'C.UTF-8'
    image: postgres:16-bookworm
    container_name: rlc-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rlc}
      POSTGRES_USER: ${POSTGRES_USER:-rlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，见 .env.example}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    # 内存参数按 4 GB 机器分配，合计约 1.3 GB（含 shared_buffers 512M）
    # 改机器规格时这几个数要一起改，否则 PG 会用满内存把别的容器挤到 swap
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1280MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=80
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      - -c
      - timezone=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: rlc-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，见 .env.example}
      TZ: ${TZ:-Asia/Shanghai}
    # 密码从容器环境读，不写进命令行（写进去会出现在 docker inspect 和 ps 里）
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 320mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    logging: *logging

  minio:
    # 首次 up 后建议固定版本：
    #   docker inspect rlc-minio --format '{{index .RepoDigests 0}}'
    # 然后把下面这行换成该 digest，避免哪天 latest 变了把数据格式带跑
    image: minio/minio:latest
    container_name: rlc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rlc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，见 .env.example}
      MINIO_REGION_NAME: ${MINIO_REGION:-cn-east-1}
      MINIO_BROWSER: "off"
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    # 故意不配 healthcheck：官方镜像不含 mc / curl，写一个假的一直 unhealthy 反而会卡住 depends_on
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  # 对外：caddy 用，唯一有 publish 端口的网络
  edge:
    driver: bridge
  # 对内：服务间通信，没有出网能力
  internal:
    driver: bridge
    internal: true
