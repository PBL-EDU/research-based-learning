# 应用层叠加：Caddy / portal (Next.js) / api (NestJS) / worker (BullMQ)
#
# 前置条件：仓库源码在 /opt/rlc/src（90-push-from-windows.ps1 -WithSource 会推），
#   且 apps/api/Dockerfile、apps/portal/Dockerfile 已存在。
#   服务端未开发完成时，只用 docker-compose.yml 起基础设施即可。
#
# 起法（两个文件必须一起给，顺序不能反）：
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# 变量注入原则：
#   api / worker 需要全部密钥 → env_file: .env
#   caddy 只需要域名和邮箱   → 显式 environment（不把数据库密码塞给它）
#   portal 只需要内部 API 地址 → 显式 environment

name: rlc

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    container_name: rlc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?PORTAL_DOMAIN 未设置}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 未设置}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN 未设置}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 未设置}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    networks: [edge, internal]
    depends_on:
      - api
      - portal
    logging: *logging

  api:
    image: ${API_IMAGE:-rlc-api:local}
    container_name: rlc-api
    restart: unless-stopped
    build:
      context: ${SRC_DIR:-./src}
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.js"]
    # api 需要全部密钥：DATABASE_URL / REDIS_URL / S3_* / SMTP_* / WECHAT_*
    env_file: [.env]
    networks: [internal, edge] # edge 仅用于出站（微信 API、SMTP）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging

  worker:
    image: ${WORKER_IMAGE:-rlc-worker:local}
    container_name: rlc-worker
    restart: unless-stopped
    build:
      context: ${SRC_DIR:-./src}
      dockerfile: apps/api/Dockerfile
    # worker 与 api 共用镜像，只是入口不同
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    networks: [internal, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 故意不配 healthcheck：worker 的「健康」只有它自己知道（队列连上了没、渲染器能不能起）。
    # 由 api 的 /api/healthz 汇总队列积压与 worker 心跳，比容器级探针更准。
    logging: *logging

  portal:
    image: ${PORTAL_IMAGE:-rlc-portal:local}
    container_name: rlc-portal
    restart: unless-stopped
    build:
      context: ${SRC_DIR:-./src}
      dockerfile: apps/portal/Dockerfile
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: ${TZ:-Asia/Shanghai}
      # 服务端渲染直接走容器内网，不绕公网
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${PORTAL_DOMAIN}
    # portal 只访问内部 API，不需要出网，也不需要任何密钥
    networks: [internal]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging

volumes:
  caddydata:
  caddyconfig:
  caddylogs:
